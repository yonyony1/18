name: Fetch OpenWrt v25.12.5
on:
  workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM_URL: "https://git.openwrt.org/openwrt/openwrt.git"
      EXPECT_TAG: "v25.12.5"
      EXPECT_COMMIT: "5b8554a95eee055c5bee96f6f2dfd3beb241e0e7"
    steps:
      - name: Checkout upstream tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --no-tags "$UPSTREAM_URL" src
          cd src
          git fetch origin tag "${EXPECT_TAG}"
          git checkout tags/"${EXPECT_TAG}"
          GOT=$(git rev-parse HEAD)
          echo "Fetched tag ${EXPECT_TAG}, commit: ${GOT}"
          if [[ "${GOT}" != "${EXPECT_COMMIT}" ]]; then
            echo "❌ Commit mismatch!"
            exit 1
          fi
          echo "✅ Commit verified"

          # 推送到自己仓库，创建一个分支保存这个版本
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:openwrt-v25.12.5
          # 同时在你的仓库打上这个tag
          git tag -f "${EXPECT_TAG}"
          git push -f origin tag "${EXPECT_TAG}"

      - name: Final verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" check.git
          cd check.git
          GOT=$(git rev-parse "refs/tags/${EXPECT_TAG}^{commit}")
          echo "Tag ${EXPECT_TAG} -> ${GOT}"
          if [[ "${GOT}" == "${EXPECT_COMMIT}" ]]; then
            echo "✅ 最终校验通过"
          else
            echo "❌ 最终校验失败"
            exit 1
          fi
