name: Build OpenWrt UDX710 SY108

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  OPENWRT_PATH: $HOME/openwrt
  CCACHE_DIR: $HOME/ccache
  OPENWRT_REPO: https://git.openwrt.org/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  SY108_REPO: https://github.com/yonyony1/sy108-mainline.git
  SY108_BRANCH: main
  CONFIG_FILE: configs/udx710.config

jobs:
  build:
    name: Build UDX710 OpenWrt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库（读取配置文件）
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison git libssl-dev libelf-dev \
            ncurses-dev python3 python3-pip unzip wget rsync file cpio ccache

      - name: 拉取 OpenWrt 主源码
        run: |
          mkdir -p $OPENWRT_PATH
          git clone --depth 1 -b "$OPENWRT_BRANCH" "$OPENWRT_REPO" "$OPENWRT_PATH"

      - name: 拉取 sy108-mainline 并覆盖移植文件
        run: |
          git clone --depth 1 -b "$SY108_BRANCH" "$SY108_REPO" /tmp/sy108-mainline
          rsync -av /tmp/sy108-mainline/ "$OPENWRT_PATH/"

      - name: CCache 缓存加速编译
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: openwrt-sy108-udx710-${{ hashFiles('configs/udx710.config') }}
          restore-keys: |
            openwrt-sy108-udx710-
        env:
          CCACHE_MAXSIZE: 10G

      - name: 导入配置并更新 defconfig
        run: |
          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "ERROR: 配置文件不存在：${CONFIG_FILE}"
            exit 1
          fi
          cp "${CONFIG_FILE}" "${OPENWRT_PATH}/.config"
          cd "${OPENWRT_PATH}"
          make defconfig

      - name: 更新 & 安装 feeds
        run: |
          cd "${OPENWRT_PATH}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 预下载所有源码包
        run: |
          cd "${OPENWRT_PATH}"
          make download -j$(nproc)

      - name: 编译固件（多线程失败自动切单线程排错）
        run: |
          cd "${OPENWRT_PATH}"
          echo "编译并发数: $(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-udx710-firmware
          path: |
            ${{ env.OPENWRT_PATH }}/bin/targets/sy108/armv8/
          if-no-files-found: error
          retention-days: 14
