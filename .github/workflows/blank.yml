name: Mirror OpenWrt upstream
on:
  workflow_dispatch

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 必须：授予token仓库写入权限
    steps:
      - name: Mirror upstream repo
        env:
          UPSTREAM_URL: "https://git.openwrt.org/openwrt/openwrt.git"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare "$UPSTREAM_URL" upstream.git
          cd upstream.git
          # 把token嵌入url做鉴权推送
          git push --mirror "https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
