name: Build UDX710 SY108

on:
  workflow_dispatch:
    inputs:
      select_config:
        description: 选择配置文件
        required: true
        default: openwrt-main.config
        type: choice
        options:
          - openwrt-main.config
          - openwrt-recovery.config

env:
  TZ: Asia/Shanghai
  OPENWRT_PATH: /opt/openwrt
  SY108_PATH: /opt/sy108-mainline
  CCACHE_DIR: /opt/ccache
  # 仓库地址
  OPENWRT_REPO: https://git.openwrt.org/openwrt/openwrt.git
  SY108_REPO: https://github.com/yonyony1/sy108-mainline.git
  LINUX_UDX710_REPO: https://github.com/yonyony1/linux-udx710.git
  UBOOT_SY108_REPO: https://github.com/yonyony1/sy108-uboot-spl.git
  BRANCH: main

jobs:
  build:
    name: UDX710 - ${{ github.event.inputs.select_config }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 安装依赖 & 初始化目录权限
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison git libssl-dev libelf-dev \
            ncurses-dev python3 python3-pip unzip wget rsync file ccache swig
          sudo mkdir -p "${OPENWRT_PATH}" "${SY108_PATH}" "${CCACHE_DIR}"
          sudo chown -R runner:runner "${OPENWRT_PATH}" "${SY108_PATH}" "${CCACHE_DIR}"

      - name: 拉取基础 OpenWrt
        run: |
          rm -rf "${OPENWRT_PATH}"
          git clone --depth 1 "${OPENWRT_REPO}" "${OPENWRT_PATH}"

      - name: 拉取 sy108-mainline（补丁、配置、脚本）
        run: |
          rm -rf "${SY108_PATH}"
          git clone --depth 1 -b "${BRANCH}" "${SY108_REPO}" "${SY108_PATH}"

      - name: 拉取 linux-udx710 内核 & sy108-uboot-spl
        run: |
          git clone --depth 1 "${LINUX_UDX710_REPO}" "${SY108_PATH}/linux-udx710"
          git clone --depth 1 "${UBOOT_SY108_REPO}" "${SY108_PATH}/sy108-uboot-spl"

      - name: 应用 sy108 移植（补丁/替换target/内核/uboot）
        run: |
          if [ -f "${SY108_PATH}/apply.sh" ]; then
            cd "${OPENWRT_PATH}"
            bash "${SY108_PATH}/apply.sh"
          else
            rsync -av --exclude=.git "${SY108_PATH}/" "${OPENWRT_PATH}/"
          fi
          # 删除原版 mediatek target，避免编译 OpenWrt One
          rm -rf "${OPENWRT_PATH}/target/linux/mediatek"
          ls -la "${OPENWRT_PATH}/target/linux/"

      - name: CCache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: udx710-sy108-${{ github.event.inputs.select_config }}
          restore-keys: |
            udx710-sy108-
        env:
          CCACHE_MAXSIZE: 10G

      - name: 导入配置 + 清理dnsmasq循环依赖 + defconfig + 静默同步内核Kconfig
        run: |
          CONFIG_FILE="${SY108_PATH}/configs/${{ github.event.inputs.select_config }}"
          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "❌ 配置不存在：${CONFIG_FILE}"
            exit 1
          fi
          cp "${CONFIG_FILE}" "${OPENWRT_PATH}/.config"
          cd "${OPENWRT_PATH}"
          # 移除会造成循环依赖的 dnsmasq_full_ipset
          sed -i '/CONFIG_PACKAGE_dnsmasq_full_ipset/d' .config
          make defconfig
          make -j1 kernel_olddefconfig
          grep -E "CONFIG_TARGET_|CONFIG_SUBTARGET|CONFIG_PACKAGE_dnsmasq" .config

      - name: feeds update & install
        run: |
          cd "${OPENWRT_PATH}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: make download
        run: |
          cd "${OPENWRT_PATH}"
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd "${OPENWRT_PATH}"
          echo "编译线程：$(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: udx710-${{ github.event.inputs.select_config }}
          path: |
            ${{ env.OPENWRT_PATH }}/bin/targets/sy108/armv8/
          if-no-files-found: error
          retention-days: 14
