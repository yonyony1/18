name: Mirror OpenWrt upstream
on:
  workflow_dispatch

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPSTREAM_URL: "https://git.openwrt.org/openwrt/openwrt.git"
      EXPECT_TAG: "v25.12.5"
      EXPECT_COMMIT: "5b8554a95eee055c5bee96f6f2dfd3beb241e0e7"
    steps:
      - name: Mirror upstream repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare "$UPSTREAM_URL" upstream.git
          cd upstream.git
          # 重点：用户名固定 x-access-token，密码是token
          git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Verify tag and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" check.git
          cd check.git
          
          GOT_COMMIT=$(git rev-parse "refs/tags/${EXPECT_TAG}^{commit}")
          
          echo "Tag: ${EXPECT_TAG}"
          echo "Expected commit: ${EXPECT_COMMIT}"
          echo "Got commit:      ${GOT_COMMIT}"

          if [[ "${GOT_COMMIT}" == "${EXPECT_COMMIT}" ]]; then
            echo "✅ 校验通过：标签 commit 匹配"
          else
            echo "❌ 校验失败：标签 commit 不匹配！"
            exit 1
          fi
