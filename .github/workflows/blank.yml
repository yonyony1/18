name: Build OpenWrt UDX710 SY108

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      openwrt_repo:
        description: OpenWrt 上游仓库
        required: true
        default: https://git.openwrt.org/openwrt/openwrt.git
      openwrt_branch:
        description: OpenWrt 分支
        required: true
        default: main
      sy108_repo:
        description: sy108-mainline 移植仓库
        required: true
        default: https://github.com/yonyony1/sy108-mainline.git
      sy108_branch:
        description: sy108-mainline 分支
        required: true
        default: main
      config_file:
        description: .config 路径（仓库内）
        required: true
        default: configs/udx710.config

env:
  TZ: Asia/Shanghai
  OPENWRT_PATH: /mnt/openwrt
  SWAP_SIZE: 4G
  CCACHE_DIR: /mnt/ccache

jobs:
  build:
    name: Build UDX710 OpenWrt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库（读取config）
        uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison git libssl-dev libelf-dev \
            ncurses-dev python3 python3-pip unzip wget rsync file cpio ccache

      - name: 拉取 OpenWrt 主源码
        run: |
          mkdir -p $OPENWRT_PATH
          git clone --depth 1 ${{ inputs.openwrt_repo }} -b ${{ inputs.openwrt_branch }} $OPENWRT_PATH

      - name: 拉取 sy108-mainline 移植包并覆盖到 OpenWrt
        run: |
          git clone --depth 1 ${{ inputs.sy108_repo }} -b ${{ inputs.sy108_branch }} /tmp/sy108-mainline
          rsync -av /tmp/sy108-mainline/ $OPENWRT_PATH/

      - name: CCache 缓存配置
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: openwrt-sy108-udx710-${{ hashFiles('**/configs/udx710.config') }}
          restore-keys: |
            openwrt-sy108-udx710-
        env:
          CCACHE_MAXSIZE: 10G

      - name: 导入 .config
        run: |
          if [ -f "${{ inputs.config_file }}" ]; then
            cp "${{ inputs.config_file }}" $OPENWRT_PATH/.config
          else
            echo "❌ 找不到配置文件：${{ inputs.config_file }}"
            exit 1
          fi
          cd $OPENWRT_PATH
          make defconfig

      - name: 更新 & 安装 feeds
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 预下载源码
        run: |
          cd $OPENWRT_PATH
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd $OPENWRT_PATH
          echo "🧵 线程数：$(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-udx710-firmware
          path: |
            ${{ env.OPENWRT_PATH }}/bin/targets/sy108/armv8/
          if-no-files-found: error
          retention-days: 14
