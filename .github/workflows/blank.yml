name: JDCloud AX1800 jdcloud_re-ss-01 QModem RM500U
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TERM: dumb
      CONFIG_NON_INTERACTIVE: 1
    timeout-minutes: 360
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
            libssl-dev libtool libyaml-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev
          git config --global core.askpass ""
          git config --global credential.helper ""

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ax1800-qmodem-ccache

      - name: Clone VIKINGYFY/immortalwrt
        run: |
          git clone --depth 1 --branch main https://github.com/VIKINGYFY/immortalwrt openwrt
          cd openwrt
          test -d target/linux/qualcommax || exit 1

      - name: Feeds configure & update & install
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          cat > feeds.conf.default <<-'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/openwrt/routing.git
          src-git telephony https://github.com/openwrt/telephony.git
          src-git qmodem https://github.com/FUjr/QModem.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 删除造成递归依赖的源码，让Kconfig看不到这两个选项
          rm -rf feeds/packages/net/clixon
          rm -rf package/network/utils/nftables-nojson

      - name: Generate defconfig && sed modify .config
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          rm -rf tmp/ .config*
          make defconfig CONFIG_NON_INTERACTIVE=1

          # sed开启目标设备与需要包，直接写进.config
          sed -i 's/# CONFIG_TARGET_qualcommax is not set/CONFIG_TARGET_qualcommax=y/' .config
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq60xx is not set/CONFIG_TARGET_qualcommax_ipq60xx=y/' .config
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_ss_01 is not set/CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_ss_01=y/' .config

          sed -i 's/# CONFIG_PACKAGE_ppp is not set/CONFIG_PACKAGE_ppp=y/' .config
          sed -i 's/# CONFIG_PACKAGE_ppp-mod-pppoe is not set/CONFIG_PACKAGE_ppp-mod-pppoe=y/' .config
          sed -i 's/# CONFIG_PACKAGE_ip-full is not set/CONFIG_PACKAGE_ip-full=y/' .config
          sed -i 's/# CONFIG_PACKAGE_ip6tables is not set/CONFIG_PACKAGE_ip6tables=y/' .config
          sed -i 's/# CONFIG_PACKAGE_iptables is not set/CONFIG_PACKAGE_iptables=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-ipt-nat is not set/CONFIG_PACKAGE_kmod-ipt-nat=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-ipt-nat6 is not set/CONFIG_PACKAGE_kmod-ipt-nat6=y/' .config

          sed -i 's/# CONFIG_PACKAGE_kmod-usb-core is not set/CONFIG_PACKAGE_kmod-usb-core=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-serial is not set/CONFIG_PACKAGE_kmod-usb-serial=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-serial-option is not set/CONFIG_PACKAGE_kmod-usb-serial-option=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-serial-wwan is not set/CONFIG_PACKAGE_kmod-usb-serial-wwan=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net is not set/CONFIG_PACKAGE_kmod-usb-net=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net-cdc-ecm is not set/CONFIG_PACKAGE_kmod-usb-net-cdc-ecm=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net-rndis is not set/CONFIG_PACKAGE_kmod-usb-net-rndis=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net-qmi-wwan is not set/CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net-cdc-mbim is not set/CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm is not set/CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-storage is not set/CONFIG_PACKAGE_kmod-usb-storage=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-usb-storage-uas is not set/CONFIG_PACKAGE_kmod-usb-storage-uas=y/' .config

          sed -i 's/# CONFIG_PACKAGE_curl is not set/CONFIG_PACKAGE_curl=y/' .config
          sed -i 's/# CONFIG_PACKAGE_usbutils is not set/CONFIG_PACKAGE_usbutils=y/' .config
          sed -i 's/# CONFIG_PACKAGE_socat is not set/CONFIG_PACKAGE_socat=y/' .config
          sed -i 's/# CONFIG_PACKAGE_nano is not set/CONFIG_PACKAGE_nano=y/' .config
          sed -i 's/# CONFIG_PACKAGE_tc is not set/CONFIG_PACKAGE_tc=y/' .config
          sed -i 's/# CONFIG_PACKAGE_iperf3 is not set/CONFIG_PACKAGE_iperf3=y/' .config

          sed -i 's/# CONFIG_PACKAGE_kmod-fs-ext4 is not set/CONFIG_PACKAGE_kmod-fs-ext4=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-fs-vfat is not set/CONFIG_PACKAGE_kmod-fs-vfat=y/' .config
          sed -i 's/# CONFIG_PACKAGE_kmod-fs-exfat is not set/CONFIG_PACKAGE_kmod-fs-exfat=y/' .config
          sed -i 's/# CONFIG_PACKAGE_ntfs-3g is not set/CONFIG_PACKAGE_ntfs-3g=y/' .config
          sed -i 's/# CONFIG_PACKAGE_block-mount is not set/CONFIG_PACKAGE_block-mount=y/' .config
          sed -i 's/# CONFIG_PACKAGE_fdisk is not set/CONFIG_PACKAGE_fdisk=y/' .config

          sed -i 's/# CONFIG_PACKAGE_qmodem is not set/CONFIG_PACKAGE_qmodem=y/' .config
          sed -i 's/# CONFIG_PACKAGE_luci-app-qmodem-next is not set/CONFIG_PACKAGE_luci-app-qmodem-next=y/' .config
          sed -i 's/# CONFIG_NSS_FIRMWARE is not set/CONFIG_NSS_FIRMWARE=y/' .config

          # 归一化配置，自动清理无效选项
          make defconfig CONFIG_NON_INTERACTIVE=1

          echo "==== Verify config ===="
          grep -E "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re_ss_01|CONFIG_PACKAGE_qmodem" .config

      - name: Build firmware
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=1
          ccache -M 4G
          ccache -z
          make -j1 V=s 2>&1 | tee build.log
          ccache -s

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AX1800-QModem-RM500U-Firmware
          path: |
            openwrt/build.log
            openwrt/.config
            openwrt/bin/targets/qualcommax/ipq60xx
          retention-days: 7
